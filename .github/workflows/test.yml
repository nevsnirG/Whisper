name: Run unit tests

on:
  push:
    branches: [ "master" ]
    paths:
      - 'test/**'
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/scripts/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'test/**'
      - 'src/**'
      - 'Directory.Build.props'
      - '.github/scripts/**'
      - '.github/workflows/test.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    # Both stated explicitly: the SDK that builds, and the .NET 8 runtime the tests run on. Without this the job
    # depends on what the runner image happens to ship.
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Build
      run: dotnet build -c Release
    - name: Test
      run: dotnet test -c Release --no-build

  # Packages are published with skip-duplicate, so a package that changed without a version bump would silently
  # never be published.
  version-bumps:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Every changed package has a new version
      run: bash .github/scripts/check-version-bumps.sh "${{ github.event.pull_request.base.sha || github.event.before }}"

  # Whisper.MediatR is compiled against its lowest supported MediatR version; these runs check it
  # still works with newer ones (12.5 changed RequestHandlerDelegate's signature).
  mediatr-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mediatr: [ "12.0.1", "12.4.1", "12.5.0", "13.1.0" ]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: |
          8.0.x
          10.0.x
    - name: Test against MediatR ${{ matrix.mediatr }}
      run: dotnet test test/Whisper.MediatR.UnitTests -c Release -p:MediatRVersion=${{ matrix.mediatr }}
