name: Run unit tests

on:
  push:
    branches: [ "master" ]
    paths:
      - 'test/**'
      - 'src/**'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [ "master" ]
    paths:
      - 'test/**'
      - 'src/**'
      - '.github/workflows/test.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
    - name: Build
      run: dotnet build -c Release
    - name: Test
      run: dotnet test -c Release --no-build

  # Whisper.MediatR is compiled against its lowest supported MediatR version; these runs check it
  # still works with newer ones (12.5 changed RequestHandlerDelegate's signature).
  mediatr-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        mediatr: [ "12.0.1", "12.4.1", "12.5.0", "13.1.0" ]
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
    - name: Test against MediatR ${{ matrix.mediatr }}
      run: dotnet test test/Whisper.MediatR.UnitTests -c Release -p:MediatRVersion=${{ matrix.mediatr }}
